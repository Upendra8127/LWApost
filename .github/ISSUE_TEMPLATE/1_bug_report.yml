name: Bug Report
description: Create a report to help us reproduce and fix a bug
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Windows 11, Ubuntu 22.04, macOS Sonoma
    validations:
      required: true
  - type: dropdown
    id: node-version
    attributes:
      label: Node.js Version
      options:
        - "Node.js 18.x"
        - "Node.js 20.x"
        - "Node.js 22.x"
        - "Node.js 24.x"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we trigger the issue?
      placeholder: |
        1. Run `python download_posts.py`
        2. Inspect output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Error Logs
      description: Paste any error outputs or stack traces here.
      render: shell
