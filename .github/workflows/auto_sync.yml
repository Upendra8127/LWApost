name: Scheduled YouTube Community Posts Auto-Sync

on:
  schedule:
    # Runs daily at 04:00 AM UTC (100% Free on GitHub Actions)
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Allows manual sync trigger with 1-click in the GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-posts:
    name: Sync Latest YouTube Posts & Cards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run Incremental Sync Engine
        run: |
          node scripts/sync_posts.mjs

      - name: Commit and Push New Cards & Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if any new posts, cards, or SW cache bumps were generated
          if [ -n "$(git status --porcelain data/posts.json cards/ sw.js)" ]; then
            echo "🔥 New posts detected! Committing changes..."
            git add data/posts.json cards/ sw.js
            git commit -m "chore(sync): auto-append latest community post cards [skip ci]"
            git push
            echo "✓ Successfully pushed new posts to repository!"
          else
            echo "✓ No changes detected. Archive is up to date."
          fi
