name: Welcome New Contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome to the **LWApost Archiver** project! Thank you for raising this issue. Our team reviews submissions under our OpenSSF SLA guidelines."
          pr-message: "Welcome and thank you for contributing! Please make sure your PR conforms to Conventional Commits and includes the DCO 1.1 sign-off (`git commit -s`)."
